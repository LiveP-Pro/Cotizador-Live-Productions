name: Verificar publicacion Requerimiento de Equipo
on:
  push:
    branches: [codex/verificar-publicacion-368dee5]
    paths: [.github/workflows/verificar-publicacion.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 368dee599c7437ab887821c21c14d88b136ac808
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar codigo publicado y pruebas
        run: |
          node --check equipment.js
          node --test test/equipment-logistics.test.cjs
      - name: Verificar archivos publicos en produccion sin modificar datos
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          commit = '368dee599c7437ab887821c21c14d88b136ac808'
          paths = {'index.html': '/', 'equipment.js': '/equipment.js', 'styles.css': '/styles.css'}
          expected = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in paths}
          result = {'commit': commit, 'site': 'https://liveproductionsgt.com', 'verified': False, 'attempts': []}
          for attempt in range(1, 5):
              checks = []
              for name, path in paths.items():
                  check = {'file': name, 'expected_sha256': expected[name]}
                  try:
                      url = result['site'] + path + '?deployment_check=' + commit[:8] + '-' + str(int(time.time()))
                      request = urllib.request.Request(url, headers={'User-Agent': 'Requerimiento-Equipo-Deploy-Check', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=10) as response:
                          data = response.read(2000000)
                          check.update(status=response.status, actual_sha256=hashlib.sha256(data).hexdigest())
                          check['matches'] = response.status == 200 and check['actual_sha256'] == expected[name]
                  except Exception as exc:
                      check.update(matches=False, error=str(exc))
                  checks.append(check)
              entry = {'attempt': attempt, 'time_utc': datetime.now(timezone.utc).isoformat(), 'checks': checks}
              result['attempts'].append(entry)
              result['verified'] = all(check['matches'] for check in checks)
              Path('publication-verification.json').write_text(json.dumps(result, indent=2))
              print(json.dumps(entry), flush=True)
              if result['verified']:
                  print('PRODUCTION_VERIFIED: HTML, equipment.js and styles.css match the authorized main commit.', flush=True)
                  break
              if attempt < 4:
                  time.sleep(20)
          if not result['verified']:
              raise SystemExit('Publication in main confirmed; production files could not yet be confirmed. See verification artifact.')
          PY
      - name: Evidencia de verificacion sin datos privados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publicacion-verificada-368dee5
          path: publication-verification.json
          retention-days: 1
