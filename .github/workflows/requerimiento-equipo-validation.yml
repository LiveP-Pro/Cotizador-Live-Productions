name: Verificación final Requerimiento de Equipo
on:
  push:
    branches:
      - codex/requerimiento-trasiegos-20260923
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evitar texto vertical en casillas de celular
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          path = Path('styles.css')
          old = path.read_bytes()
          before = 'c8b67ec6637c065f8c2aab2aefe2148f49c56873526dcd2319aaa9faf9f775fd'
          after = 'c43ed6e629da3269aa07130444010e68d8889383eac1c5d88854aadeacd80ecc'
          current = hashlib.sha256(old).hexdigest()
          if current != after:
              assert current == before, 'La hoja de estilos cambió; no sobrescribir.'
              added = '\n/* Keep transfer names readable on phones; scroll the checklist horizontally. */\n.equipment-transfer-card .equipment-transfer-selected-list table { min-width: 860px; }\n'
              result = old + added.encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == after
              path.write_bytes(result)
      - name: Verificar sintaxis y las 26 pruebas
        run: |
          node --check equipment.js
          node --test test/equipment-logistics.test.cjs
          git diff --check
      - name: Guardar ajuste y retirar workflow temporal de la rama
        run: |
          test "$GITHUB_REF_NAME" = "codex/requerimiento-trasiegos-20260923"
          git add styles.css
          git rm .github/workflows/requerimiento-equipo-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ajustar listado en celular y retirar workflow temporal de revisión'
          git push origin HEAD:refs/heads/codex/requerimiento-trasiegos-20260923
      - name: Archivos finales verificados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requerimiento-equipo-final
          path: |
            equipment.js
            index.html
            styles.css
            test/equipment-logistics.test.cjs
          retention-days: 1
