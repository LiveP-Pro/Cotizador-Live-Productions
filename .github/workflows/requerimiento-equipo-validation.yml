name: Validar Requerimiento de Equipo
on:
  push:
    branches:
      - codex/requerimiento-trasiegos-20260923
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar cambios revisados sobre archivos exactos
        shell: python
        run: |
          import base64, hashlib, json, lzma
          from pathlib import Path
          encoded = ''
          payload = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(payload).hexdigest() == '211904b7fd2474a9c11f8836d0d794b834700a212b237b44fbdd7ccb955260a9'
          changes = json.loads(payload)
          allowed = {'equipment.js', 'index.html', 'styles.css', 'test/equipment-logistics.test.cjs'}
          assert {item['path'] for item in changes} == allowed
          prepared = []
          for item in changes:
              path = Path(item['path'])
              original = path.read_bytes()
              current = hashlib.sha256(original).hexdigest()
              if current == item['result']:
                  continue
              assert current == item['base'], 'La base cambió: ' + str(path)
              lines = original.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(item['ops']):
                  lines[start:end] = [replacement]
              updated = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(updated).hexdigest() == item['result'], 'Resultado incorrecto: ' + str(path)
              prepared.append((path, updated))
          for path, content in prepared:
              path.write_bytes(content)
              print('Aplicado:', path)
      - name: Verificar sintaxis y pruebas de logística
        run: |
          node --check equipment.js
          node --test test/equipment-logistics.test.cjs
          git diff --check
      - name: Guardar únicamente en la rama de revisión
        run: |
          test "$GITHUB_REF_NAME" = "codex/requerimiento-trasiegos-20260923"
          git add equipment.js index.html styles.css test/equipment-logistics.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Corregir selección de trasiegos, backline y reporte de compra'
            git push origin HEAD:refs/heads/codex/requerimiento-trasiegos-20260923
          fi
      - name: Archivos verificados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requerimiento-equipo-verificado
          path: |
            equipment.js
            index.html
            styles.css
            test/equipment-logistics.test.cjs
          retention-days: 1
